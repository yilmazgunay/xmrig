name: Build XMRig Windows

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-2022

    steps:
    - name: Checkout XMRig
      uses: actions/checkout@v4

    - name: Clone XMRig Dependencies
      run: git clone https://github.com/xmrig/xmrig-deps.git C:\xmrig-deps

    - name: Configure CMake
      run: |
        mkdir build
        cd build
        cmake .. -G "Visual Studio 17 2022" -A x64 -DXMRIG_DEPS=C:\xmrig-deps\msvc2022\x64

    - name: Build XMRig (Release)
      run: |
        cd build
        cmake --build . --config Release

    - name: Upload Binary
      uses: actions/upload-artifact@v4
      with:
        name: xmrig-zero-fee-windows
        path: build/Release/xmrig.exe
